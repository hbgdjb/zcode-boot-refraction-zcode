<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>ZCode</title>
<style>/* ==========================================================================
   ZCode "Refraction" — boot layer
   One plane of parallel hairlines, one mark, one wordmark, one loading cut.
   Animated properties: transform, opacity, clip-path. Nothing else.
   ========================================================================== */

.zcb {
  --zcb-ink: #0a0a0b;
  --zcb-paper: #fbfaf7;
  --zcb-mark: #f7f5ef;
  --zcb-muted: rgba(10, 10, 11, 0.5);
  --zcb-soft: rgba(10, 10, 11, 0.72);
  --zcb-hair: rgba(10, 10, 11, 0.1);
  --zcb-red: #f02e27;
  --zcb-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --zcb-ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  --zcb-seam: -50deg;
  --zcb-sans: "Inter", "SF Pro Display", "Segoe UI Variable Display", "Segoe UI",
    "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  --zcb-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --grain: none;
  --zcb-lift: -100%;
  --px: 0;

  position: fixed;
  inset: 0;
  z-index: 2147483000;
  overflow: hidden;
  background: var(--zcb-paper);
  color: var(--zcb-ink);
  font-family: var(--zcb-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  contain: strict;
  will-change: transform;
}

.zcb *,
.zcb *::before,
.zcb *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* ------------------------------------------------------------ the line plane */

.zcb__field {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  transition: opacity 900ms var(--zcb-ease);
}

.zcb__grain {
  position: absolute;
  inset: 0;
  background-image: var(--grain);
  background-size: 160px 160px;
  opacity: 0.045;
  mix-blend-mode: multiply;
  pointer-events: none;
}

/* ------------------------------------------------------- the dark planes */

.zcb__dark {
  position: absolute;
  inset: 0;
  color: var(--zcb-mark);
  pointer-events: none;
}

.zcb__half {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 320vmax;
  height: 320vmax;
  margin: -160vmax 0 0 -160vmax;
  background: #050506;
  transform: rotate(var(--zcb-seam)) translate3d(0, 0, 0);
  will-change: transform;
}

.zcb__half--a {
  clip-path: polygon(0 0, 100% 0, 100% 50.4%, 0 50.4%);
}

.zcb__half--b {
  clip-path: polygon(0 49.6%, 100% 49.6%, 100% 100%, 0 100%);
}

.zcb.is-split .zcb__half--a {
  transform: rotate(var(--zcb-seam)) translate3d(0, -118vmax, 0);
  transition: transform 980ms cubic-bezier(0.7, 0, 0.3, 1);
}

.zcb.is-split .zcb__half--b {
  transform: rotate(var(--zcb-seam)) translate3d(0, 118vmax, 0);
  transition: transform 980ms cubic-bezier(0.7, 0, 0.3, 1);
}

/* The cut edge carries the spectrum with it, so the light stays welded to the
   black instead of being left behind in the widening gap. */
.zcb__half::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 190px;
  opacity: 0;
  background: linear-gradient(
    90deg,
    rgba(143, 216, 242, 0) 0%,
    rgba(143, 216, 242, 0.7) 14%,
    rgba(185, 166, 255, 0.85) 36%,
    rgba(255, 255, 255, 0.9) 50%,
    rgba(255, 183, 200, 0.85) 64%,
    rgba(255, 217, 166, 0.65) 84%,
    rgba(255, 217, 166, 0) 100%
  );
  pointer-events: none;
}

.zcb__half--a::after {
  top: calc(50.4% - 190px);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 88%);
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000 88%);
}

.zcb__half--b::after {
  top: 49.6%;
  -webkit-mask-image: linear-gradient(to bottom, #000 12%, rgba(0, 0, 0, 0) 100%);
  mask-image: linear-gradient(to bottom, #000 12%, rgba(0, 0, 0, 0) 100%);
}

.zcb.is-split .zcb__half::after {
  opacity: 0.9;
  transition: opacity 220ms;
}

.zcb__seam {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 300vmax;
  height: 4px;
  margin: -2px 0 0 -150vmax;
  transform: rotate(var(--zcb-seam)) scaleY(0.1);
  opacity: 0;
  background: linear-gradient(
    90deg,
    rgba(143, 216, 242, 0) 0%,
    rgba(143, 216, 242, 0.85) 16%,
    rgba(185, 166, 255, 0.95) 38%,
    rgba(255, 255, 255, 1) 50%,
    rgba(255, 183, 200, 0.95) 62%,
    rgba(255, 217, 166, 0.8) 82%,
    rgba(255, 217, 166, 0) 100%
  );
  filter: blur(3px);
  mix-blend-mode: screen;
  box-shadow:
    0 0 20px 4px rgba(185, 166, 255, 0.5),
    0 0 70px 24px rgba(143, 216, 242, 0.28),
    0 0 160px 64px rgba(255, 183, 200, 0.14);
}

.zcb.is-split .zcb__seam {
  transform: rotate(var(--zcb-seam)) scaleY(1);
  opacity: 1;
  transition: transform 900ms cubic-bezier(0.3, 0, 0.2, 1), opacity 640ms 200ms ease-out;
}

/* ----------------------------------------------------------------- the mark */

.zcb__mark {
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(168px, 19vw, 292px);
  aspect-ratio: 580 / 504;
  translate: -50% -50%;
  color: var(--zcb-mark);
  will-change: transform, opacity;
}

.zcb__mark svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.zcb__ghost {
  opacity: 0.07;
}

.zcb__stroke {
  clip-path: inset(0 100% 0 0);
}

.zcb.is-sign .zcb__stroke {
  clip-path: inset(0 0 0 0);
  transition: clip-path 620ms var(--zcb-ease-io);
  transition-delay: calc(var(--i) * 175ms + 150ms);
}

.zcb__edge {
  opacity: 0;
  z-index: 3;
}

.zcb__edge-line {
  fill: none;
  stroke: #f4efff;
  stroke-linecap: round;
  opacity: 0;
  filter:
    drop-shadow(2px 0 0 rgba(143, 216, 242, 0.9))
    drop-shadow(-2px 0 0 rgba(255, 183, 200, 0.9))
    drop-shadow(0 0 10px rgba(185, 166, 255, 0.8));
  transition: opacity 420ms var(--zcb-ease);
}

.zcb__edge-glow {
  fill: none;
  stroke: #b9a6ff;
  stroke-linecap: round;
  opacity: 0;
  filter: blur(6px);
  transition: opacity 420ms var(--zcb-ease);
}

.zcb.is-sign .zcb__edge {
  opacity: 1;
  transition: opacity 200ms 760ms linear;
}

.zcb.is-sign .zcb__edge-line {
  opacity: 1;
  transition-delay: 780ms;
}

.zcb.is-sign .zcb__edge-glow {
  opacity: 0.4;
  transition-delay: 780ms;
}

.zcb.is-sign .zcb__edge-line--left {
  transition-delay: 880ms;
}

.zcb.is-split .zcb__mark {
  opacity: 0;
  transform: scale(1.14) translate3d(0, -1.6vh, 0);
  transition: opacity 460ms 80ms var(--zcb-ease-io), transform 780ms var(--zcb-ease);
}

/* -------------------------------------------------------------------- hero */

.zcb__ui {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.zcb__hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 24px 3vh;
  transform: translate3d(calc(var(--px) * 6px), 0, 0);
}

.zcb__title {
  font-size: clamp(64px, 9.4vw, 164px);
  line-height: 0.9;
  letter-spacing: -0.055em;
  font-weight: 500;
  margin: 0 0 0 -0.055em;
  display: flex;
}

.zcb__word {
  display: inline-flex;
  align-items: baseline;
}

.zcb__mask {
  display: inline-block;
  overflow: hidden;
  padding: 0.06em 0.01em 0.08em;
}

.zcb__mask > span {
  display: inline-block;
  transform: translate3d(0, 116%, 0);
  transition: transform 780ms var(--zcb-ease);
  transition-delay: calc(var(--i) * 50ms + 60ms);
  will-change: transform;
}

.zcb__dot {
  width: clamp(9px, 0.85vw, 15px);
  height: clamp(9px, 0.85vw, 15px);
  border-radius: 50%;
  background: var(--zcb-red);
  margin-left: 0.1em;
  align-self: flex-end;
  margin-bottom: 0.18em;
  opacity: 0;
  transform: scale(0.2);
  transition: opacity 500ms var(--zcb-ease), transform 860ms var(--zcb-ease);
  transition-delay: 700ms;
}

.zcb__status {
  margin-top: clamp(18px, 2.2vh, 26px);
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-size: clamp(10px, 0.8vw, 12px);
  letter-spacing: 0.26em;
  color: var(--zcb-muted);
  opacity: 0;
  transform: translate3d(0, 8px, 0);
  transition: opacity 900ms var(--zcb-ease), transform 900ms var(--zcb-ease);
  transition-delay: 560ms;
}

.zcb__status i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--zcb-red);
  animation: zcb-pulse 2.4s ease-in-out infinite;
}

.zcb__status span {
  display: inline-block;
  transition: opacity 150ms linear;
}

/* ------------------------------------------------------------ power line */

.zcb__power {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(46vw, 560px);
  height: 1px;
  transform: translate3d(-50%, -50%, 0) scaleX(0);
  background: linear-gradient(
    90deg,
    rgba(143, 216, 242, 0) 0%,
    rgba(143, 216, 242, 0.75) 22%,
    rgba(185, 166, 255, 0.95) 50%,
    rgba(255, 183, 200, 0.8) 78%,
    rgba(255, 217, 166, 0) 100%
  );
  box-shadow: 0 0 18px 1px rgba(185, 166, 255, 0.35);
  opacity: 0;
  pointer-events: none;
}

.zcb.is-power .zcb__power {
  opacity: 1;
  transform: translate3d(-50%, -50%, 0) scaleX(1);
  transition: transform 520ms var(--zcb-ease-io), opacity 180ms ease;
}

.zcb.is-sign .zcb__power {
  opacity: 0;
  transition: opacity 380ms ease;
}

/* ------------------------------------------------------------ black slab */

.zcb__slab {
  position: absolute;
  inset: 0;
  background: #fbfaf7;
  transform: translate3d(0, -100%, 0);
  will-change: transform;
}

.zcb--dark .zcb__slab {
  background: #050506;
}

.zcb__slab::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: linear-gradient(
    90deg,
    rgba(143, 216, 242, 0) 0%,
    rgba(143, 216, 242, 0.9) 16%,
    rgba(185, 166, 255, 0.95) 40%,
    rgba(255, 255, 255, 0.95) 50%,
    rgba(255, 183, 200, 0.9) 62%,
    rgba(255, 217, 166, 0.75) 84%,
    rgba(255, 217, 166, 0) 100%
  );
  box-shadow: 0 0 24px 2px rgba(185, 166, 255, 0.45);
  opacity: 0;
}

.zcb.is-slab .zcb__slab {
  transform: translate3d(0, 0, 0);
  transition: transform 1100ms cubic-bezier(0.76, 0, 0.24, 1);
}

.zcb.is-slab .zcb__slab::after {
  opacity: 1;
  transition: opacity 220ms ease;
}

.zcb.is-sketch .zcb__slab::after {
  opacity: 0;
  transition: opacity 500ms ease;
}

.zcb.is-slab .zcb__skip {
  opacity: 0;
  transition: opacity 300ms ease;
}

/* --------------------------------------------------------- desktop sketch */

.zcb__sketch {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  color: var(--zcb-ink);
  pointer-events: none;
  opacity: 0;
}

.zcb.is-sketch .zcb__sketch {
  opacity: 1;
  animation: zcb-breathe 3.4s ease-in-out 1.2s infinite;
}

@keyframes zcb-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.86; }
}

.zcb__sk {
  fill: none;
  stroke: currentColor;
  stroke-width: 1;
  stroke-opacity: 0.42;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: var(--len, 2200);
  stroke-dashoffset: var(--len, 2200);
}

.zcb__sk--send {
  stroke: rgba(240, 46, 39, 0.62);
  stroke-opacity: 1;
}

.zcb.is-sketch .zcb__sk {
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 420ms var(--zcb-ease-io);
  transition-delay: calc(var(--i) * 80ms);
}

.zcb--dark .zcb__sketch {
  color: var(--zcb-mark);
}

/* ------------------------------------------------------------ loading cut */

.zcb__cut {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: rgba(10, 10, 11, 0.06);
  pointer-events: none;
}

.zcb__cut i {
  display: block;
  width: 100%;
  height: 100%;
  transform: scaleX(0);
  transform-origin: 0 50%;
  background: linear-gradient(
    90deg,
    rgba(143, 216, 242, 0) 0%,
    #8fd8f2 12%,
    #b9a6ff 42%,
    #ffb7c8 72%,
    #ffd9a6 96%,
    rgba(255, 217, 166, 0) 100%
  );
}

.zcb__skip {
  position: absolute;
  right: clamp(18px, 3vw, 34px);
  bottom: clamp(16px, 2.6vh, 26px);
  font-family: var(--zcb-mono);
  font-size: 8px;
  letter-spacing: 0.26em;
  color: var(--zcb-muted);
  opacity: 0;
  transition: opacity 800ms 500ms ease;
}

/* ------------------------------------------------------------- entrance */

.zcb.is-field .zcb__mask > span {
  transform: translate3d(0, 0, 0);
}

.zcb.is-field .zcb__dot {
  opacity: 1;
  transform: scale(1);
}

.zcb.is-field .zcb__status {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

/* The split apparatus has done its job; retire it so the ray plane is the
   only thing left on screen. */
.zcb.is-field .zcb__dark {
  opacity: 0;
  transition: opacity 700ms ease;
}

.zcb.is-field .zcb__skip {
  opacity: 1;
}

.zcb.is-field .zcb__cut i {
  transform: scaleX(1);
  transition: transform 3500ms linear;
}

/* ---------------------------------------------------------------- exit */

.zcb.is-exit {
  opacity: 0;
  transition: opacity 820ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* -------------------------------------------------------------- responsive */

@media (max-width: 640px) {
  .zcb__skip {
    display: none;
  }
}

@keyframes zcb-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.78); }
}

/* ------------------------------------------------------------------ reduced */

@media (prefers-reduced-motion: reduce) {
  .zcb *,
  .zcb *::before,
  .zcb *::after {
    animation: none !important;
    transition-duration: 1ms !important;
    transition-delay: 0ms !important;
  }

  .zcb.is-sign .zcb__stroke {
    clip-path: inset(0 0 0 0);
  }

  .zcb.is-field .zcb__mask > span {
    transform: none;
  }
}

/* Static pose used by reduced motion and by ?zcb=still / pose:* */
.zcb.zcb--static .zcb__dark {
  display: none;
}

.zcb.zcb--static .zcb__status,
.zcb.zcb--static .zcb__skip {
  opacity: 1;
  transform: none;
}

.zcb.zcb--static .zcb__mask > span {
  transform: none;
}

.zcb.zcb--static .zcb__dot {
  opacity: 1;
  transform: scale(1);
}

.zcb.zcb--static .zcb__cut i {
  transform: scaleX(1);
}

.zcb.zcb--static .zcb__sketch {
  display: none;
}

.zcb.zcb--pose *,
.zcb.zcb--pose *::before,
.zcb.zcb--pose *::after {
  transition: none !important;
  animation: none !important;
}
</style>
<style>/* Portrait tuning: the mark and the wordmark are sized off the width, and the
   only chrome left is the hairline along the bottom. */
html, body {
  margin: 0;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

body {
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
}

.zcb__mark {
  width: clamp(148px, 46vw, 240px);
}

.zcb__title {
  font-size: clamp(46px, 14.5vw, 78px);
  letter-spacing: -0.05em;
}

.zcb__hero {
  padding: 0 18px 2vh;
}

.zcb__status {
  margin-top: 14px;
  font-size: 9px;
  letter-spacing: 0.2em;
}

.zcb__skip {
  display: none;
}

.zcb__cut {
  height: 1px;
}
</style>
</head>
<body>
<div class="zcb" id="zcb-root" data-zcb-root role="progressbar" aria-label="正在启动 ZCode" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><canvas class="zcb__field" data-zcb-canvas aria-hidden="true"></canvas><div class="zcb__grain" aria-hidden="true"></div><div class="zcb__dark" aria-hidden="true"><div class="zcb__half zcb__half--a"></div><div class="zcb__half zcb__half--b"></div><div class="zcb__seam"></div><div class="zcb__mark" aria-hidden="true"><div class="zcb__ghost"><svg viewBox="215 258 580 504"><path d="M262 288 H515 L476 352 H262 Z" fill="currentColor"></path><path d="M515 288 H765 L497 732 H245 Z" fill="currentColor"></path><path d="M534 668 H745 V732 H497 Z" fill="currentColor"></path></svg></div><svg class="zcb__stroke" style="--i:0;" viewBox="215 258 580 504" aria-hidden="true"><path d="M262 288 H515 L476 352 H262 Z" fill="currentColor"></path></svg><svg class="zcb__stroke" style="--i:1;" viewBox="215 258 580 504" aria-hidden="true"><path d="M515 288 H765 L497 732 H245 Z" fill="currentColor"></path></svg><svg class="zcb__stroke" style="--i:2;" viewBox="215 258 580 504" aria-hidden="true"><path d="M534 668 H745 V732 H497 Z" fill="currentColor"></path></svg><svg class="zcb__edge" viewBox="215 258 580 504" aria-hidden="true"><path class="zcb__edge-glow" d="M765 288 L497 732" stroke-width="26"></path><path class="zcb__edge-line" d="M765 288 L497 732" stroke-width="6"></path><path class="zcb__edge-line zcb__edge-line--left" d="M515 288 L245 732" stroke-width="2.4"></path></svg></div></div><div class="zcb__power" aria-hidden="true"></div><div class="zcb__ui"><main class="zcb__hero"><h1 class="zcb__title" aria-label="ZCode"><span class="zcb__word" aria-hidden="true"><span class="zcb__mask"><span style="--i:0;">Z</span></span><span class="zcb__mask"><span style="--i:1;">C</span></span><span class="zcb__mask"><span style="--i:2;">o</span></span><span class="zcb__mask"><span style="--i:3;">d</span></span><span class="zcb__mask"><span style="--i:4;">e</span></span><span class="zcb__dot"></span></span></h1><p class="zcb__status"><i></i><span data-zcb-status>正在载入工作台</span></p></main></div><div class="zcb__cut" aria-hidden="true"><i data-zcb-progress></i></div><div class="zcb__slab" aria-hidden="true"></div><svg class="zcb__sketch" aria-hidden="true"></svg><span class="zcb__skip">ESC / 任意键</span></div>
<script>/**
 * The parallel ray field.
 *
 * A plane of hairlines at exactly the mark's diagonal (-50deg), all parallel by
 * construction. One spectral beam crosses the plane at constant speed on a
 * fixed cycle; the lines it passes light up in order. Nothing organic, nothing
 * random: the only motion is that sweep.
 *
 * The beam is treated as light passing through glass, not paint: the paper
 * takes a wide spectral wash, the ruling dissolves where the light is strong,
 * and the lit line splits into a cool and a warm strand. Geometry stays exact.
 *
 * Exposes `window.ZCField.create(canvas)`:
 *   { start, stop, freeze, setPointer, setEnergy, destroy }
 */
(function () {
  'use strict'

  var ANGLE = (-50 * Math.PI) / 180
  var SPACING = 24
  var BEAM_SIGMA = 78
  var SWEEP_MS = 2200
  var CYCLE_MS = 2900
  var WASH_HALF = 300
  var PAPER = '#fbfaf7'
  var STOPS = [
    [120, 205, 240],
    [160, 135, 255],
    [255, 150, 175],
    [255, 200, 130],
  ]

  function mix(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ]
  }

  function spectral(u) {
    var t = Math.max(0, Math.min(1, u)) * (STOPS.length - 1)
    var i = Math.min(STOPS.length - 2, Math.floor(t))
    return mix(STOPS[i], STOPS[i + 1], t - i)
  }

  function lighten(rgb, amount) {
    return mix(rgb, [255, 255, 255], amount)
  }

  function create(canvas, options) {
    var ctx = canvas.getContext('2d')
    if (!ctx) return null

    var opts = options || {}
    var spacing = opts.spacing > 0 ? opts.spacing : SPACING
    var sigma = opts.sigma > 0 ? opts.sigma : BEAM_SIGMA

    var dpr = Math.min(window.devicePixelRatio || 1, 2)
    var width = 1
    var height = 1
    var time = 0
    var last = 0
    var raf = 0
    var running = false
    var frozen = false
    var energy = 0
    var pointer = 0
    var pointerTarget = 0

    function resize() {
      var rect = canvas.getBoundingClientRect()
      var nextW = Math.max(1, Math.round(rect.width))
      var nextH = Math.max(1, Math.round(rect.height))
      if (nextW === width && nextH === height && canvas.width) return
      width = nextW
      height = nextH
      canvas.width = Math.round(width * dpr)
      canvas.height = Math.round(height * dpr)
    }

    function line(offset, dx, dy, nx, ny, reach, cx, cy) {
      ctx.beginPath()
      ctx.moveTo(cx + nx * offset - dx * reach, cy + ny * offset - dy * reach)
      ctx.lineTo(cx + nx * offset + dx * reach, cy + ny * offset + dy * reach)
      ctx.stroke()
    }

    function draw() {
      resize()
      var w = width
      var h = height
      var diag = Math.sqrt(w * w + h * h)
      var cx = w / 2
      var cy = h / 2
      var dx = Math.cos(ANGLE)
      var dy = Math.sin(ANGLE)
      var nx = -dy
      var ny = dx
      var reach = diag / 2 + 40

      var count = Math.ceil(diag / spacing) + 4
      var start = -((count - 1) / 2) * spacing

      // Beam position along the normal: one constant-speed pass per cycle,
      // both endpoints outside the frame so the wrap is invisible.
      var phase = time % CYCLE_MS
      var progress = Math.min(phase / SWEEP_MS, 1)
      // Start and end beyond the frame corners so the wrap is invisible, but
      // no further than that: the beam is on screen for most of each cycle.
      var beam = (-0.70 + progress * 1.40) * diag + pointer * 26

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      ctx.globalCompositeOperation = 'source-over'

      // The sheet itself: a touch warmer at the top, cooler at the foot, so the
      // plane reads as a surface with a body rather than flat fill.
      var body = ctx.createLinearGradient(0, 0, 0, h)
      body.addColorStop(0, '#fdfbf6')
      body.addColorStop(0.55, PAPER)
      body.addColorStop(1, '#f5f5f4')
      ctx.fillStyle = body
      ctx.fillRect(0, 0, w, h)

      // The sheet carries a quiet iridescence of its own: frosted glass, not
      // flat paper. Kept under 0.07 so it is felt rather than read.
      var amb = ctx.createLinearGradient(
        cx + nx * -diag * 0.55, cy + ny * -diag * 0.55,
        cx + nx * diag * 0.55, cy + ny * diag * 0.55
      )
      amb.addColorStop(0, 'rgba(160,210,245,0.06)')
      amb.addColorStop(0.3, 'rgba(205,190,255,0.07)')
      amb.addColorStop(0.55, 'rgba(255,235,240,0.03)')
      amb.addColorStop(0.78, 'rgba(255,220,185,0.06)')
      amb.addColorStop(1, 'rgba(255,235,215,0)')
      ctx.save()
      ctx.globalCompositeOperation = 'multiply'
      ctx.fillStyle = amb
      ctx.fillRect(0, 0, w, h)
      ctx.restore()

      // Light that came through the glass: a wide spectral wash tinting the
      // sheet. Multiply keeps it as pigment on paper instead of paint on top.
      var near = beam - WASH_HALF
      var far = beam + WASH_HALF
      var wash = ctx.createLinearGradient(
        cx + nx * near, cy + ny * near,
        cx + nx * far, cy + ny * far
      )
      wash.addColorStop(0, 'rgba(169,220,245,0)')
      wash.addColorStop(0.16, 'rgba(169,220,245,0.11)')
      wash.addColorStop(0.38, 'rgba(203,185,255,0.13)')
      wash.addColorStop(0.54, 'rgba(255,195,210,0.11)')
      wash.addColorStop(0.76, 'rgba(255,224,184,0.09)')
      wash.addColorStop(1, 'rgba(255,224,184,0)')
      ctx.save()
      ctx.globalCompositeOperation = 'multiply'
      ctx.fillStyle = wash
      ctx.fillRect(0, 0, w, h)
      ctx.restore()

      // A soft bloom riding the beam: light pooling on the sheet.
      var bx = cx + nx * beam
      var by = cy + ny * beam
      var bloom = ctx.createRadialGradient(bx, by, 0, bx, by, 320)
      bloom.addColorStop(0, 'rgba(255,255,255,0.14)')
      bloom.addColorStop(1, 'rgba(255,255,255,0)')
      ctx.save()
      ctx.globalCompositeOperation = 'soft-light'
      ctx.fillStyle = bloom
      ctx.beginPath()
      ctx.arc(bx, by, 320, 0, Math.PI * 2)
      ctx.fill()
      ctx.restore()

      ctx.lineCap = 'butt'
      ctx.lineWidth = 1

      for (var i = 0; i < count; i++) {
        var offset = start + i * spacing
        var distance = offset - beam
        var lit = Math.exp(-(distance * distance) / (2 * sigma * sigma))

        // The ruling dissolves under the light: the beam is an aperture, not a
        // brighter line drawn over the grid.
        var base = 0.046 + lit * 0.085 * energy
        ctx.strokeStyle = 'rgba(10,10,11,' + base.toFixed(3) + ')'
        line(offset, dx, dy, nx, ny, reach, cx, cy)

        if (lit < 0.012 || energy <= 0) continue

        // Slow caustic breathing along the normal; still one moving figure.
        var ripple = 0.9 + 0.1 * Math.sin(offset * 0.018 - time * 0.0008)
        var litA = lit * energy * ripple
        var u = 0.5 + distance / (2 * sigma * 2.4)
        var hue = spectral(u)
        var cool = spectral(u - 0.24)
        var warm = spectral(u + 0.24)
        var core = lighten(hue, 0.32)
        var shift = 1.4 + 2.2 * lit
        var glow = 'rgba(' + hue[0] + ',' + hue[1] + ',' + hue[2] + ','

        ctx.strokeStyle = glow + (0.06 * litA).toFixed(3) + ')'
        ctx.lineWidth = 12
        line(offset, dx, dy, nx, ny, reach, cx, cy)

        ctx.strokeStyle = glow + (0.28 * litA).toFixed(3) + ')'
        ctx.lineWidth = 2.6
        line(offset, dx, dy, nx, ny, reach, cx, cy)

        // Dispersion: the lit hairline splits into a cool and a warm strand,
        // the way a glass edge separates the spectrum.
        ctx.lineWidth = 1
        ctx.strokeStyle = 'rgba(' + cool[0] + ',' + cool[1] + ',' + cool[2] + ','
          + (0.42 * litA).toFixed(3) + ')'
        line(offset - shift, dx, dy, nx, ny, reach, cx, cy)

        ctx.strokeStyle = 'rgba(' + warm[0] + ',' + warm[1] + ',' + warm[2] + ','
          + (0.42 * litA).toFixed(3) + ')'
        line(offset + shift, dx, dy, nx, ny, reach, cx, cy)

        ctx.strokeStyle = 'rgba(' + core[0] + ',' + core[1] + ',' + core[2] + ','
          + (0.62 * litA).toFixed(3) + ')'
        line(offset, dx, dy, nx, ny, reach, cx, cy)
      }
    }

    function loop(now) {
      if (!running) return
      raf = requestAnimationFrame(loop)
      if (last && now - last < 30) return
      var dt = last ? Math.min((now - last) / 1000, 0.12) : 0.016
      last = now
      time += dt * 1000
      pointer += (pointerTarget - pointer) * 0.06
      try {
        draw()
      } catch (error) {
        stop()
        if (window.console) console.warn(error)
      }
    }

    function start() {
      if (running) return
      resize()
      running = true
      last = 0
      raf = requestAnimationFrame(loop)
      window.addEventListener('resize', resize)
    }

    function stop() {
      running = false
      if (raf) cancelAnimationFrame(raf)
      raf = 0
      window.removeEventListener('resize', resize)
    }

    function freeze(at) {
      stop()
      frozen = true
      if (typeof at === 'number') time = at
      try {
        draw()
      } catch (error) {
        if (window.console) console.warn(error)
      }
    }

    function setPointer(value) {
      pointerTarget = Math.max(-1, Math.min(1, value))
    }

    function setEnergy(value) {
      energy = Math.max(0, Math.min(1, value))
    }

    function destroy() {
      stop()
    }

    return {
      start: start,
      stop: stop,
      freeze: freeze,
      setPointer: setPointer,
      setEnergy: setEnergy,
      destroy: destroy,
      get frozen() {
        return frozen
      },
    }
  }

  window.ZCField = { create: create }
})()

;/**
 * Portrait timeline for the phone splash.
 *
 * Same four acts as the desktop film, compressed to about eight seconds, with
 * a shell traced for a phone: a header line, the brand, and the composer at
 * the foot. Touch or any key ends it immediately.
 */
(function () {
  'use strict'

  var T = {
    sign: 600,
    split: 1500,
    field: 2150,
    slab: 4950,
    sketch: 6250,
    exit: 7350,
  }

  var root = document.getElementById('zcb-root')
  if (!root) return

  root.classList.add('zcb--dark')

  var canvas = root.querySelector('[data-zcb-canvas]')
  var field = window.ZCField && canvas
    ? window.ZCField.create(canvas, { spacing: 18, sigma: 58 })
    : null
  var timers = []
  var done = false

  function after(ms, fn) {
    timers.push(setTimeout(function () {
      if (!done) fn()
    }, ms))
  }

  function stopTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i])
    timers.length = 0
  }

  /**
   * The phone shell: a header rule, the mark, and the composer pinned to the
   * foot of the screen — the shape ZCode's app settles into on a phone.
   */
  function traceShell() {
    var svg = root.querySelector('.zcb__sketch')
    if (!svg) return
    var w = window.innerWidth
    var h = window.innerHeight
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h)
    svg.setAttribute('preserveAspectRatio', 'none')
    while (svg.firstChild) svg.removeChild(svg.firstChild)

    var top = Math.round(h * 0.082)
    // The home screen keeps the composer in the middle, with the greeting
    // above it — not pinned to the foot like a conversation does.
    var box = {
      x: Math.round(w * 0.05),
      y: Math.round(h * 0.455),
      w: Math.round(w * 0.9),
      h: Math.round(h * 0.088),
    }
    var send = Math.max(26, Math.round(box.h * 0.42))

    var shapes = [
      { tag: 'path', cls: 'top', d: 'M0 ' + top + ' H' + w },
      { tag: 'path', cls: 'brand', d: 'M18 26 H34 L18 46 H34' },
      {
        tag: 'path',
        cls: 'head',
        d: 'M' + Math.round(w * 0.1) + ' ' + Math.round(h * 0.4)
          + ' H' + Math.round(w * 0.52),
      },
      {
        tag: 'rect',
        cls: 'composer',
        x: box.x,
        y: box.y,
        width: box.w,
        height: box.h,
        rx: 22,
      },
      {
        tag: 'path',
        cls: 'prompt',
        d: 'M' + (box.x + 20) + ' ' + (box.y + Math.round(box.h * 0.56))
          + ' H' + (box.x + 20 + Math.round(box.w * 0.34)),
      },
      {
        tag: 'rect',
        cls: 'send',
        x: box.x + box.w - 18 - send,
        y: box.y + Math.round((box.h - send) / 2),
        width: send,
        height: send,
        rx: Math.round(send / 2),
      },
    ]

    for (var s = 0; s < shapes.length; s++) {
      var spec = shapes[s]
      var el = document.createElementNS('http://www.w3.org/2000/svg', spec.tag)
      el.setAttribute('class', 'zcb__sk zcb__sk--' + spec.cls)
      el.style.setProperty('--i', String(s))
      if (spec.tag === 'path') {
        el.setAttribute('d', spec.d)
      } else {
        el.setAttribute('x', spec.x)
        el.setAttribute('y', spec.y)
        el.setAttribute('width', spec.width)
        el.setAttribute('height', spec.height)
        el.setAttribute('rx', spec.rx)
      }
      svg.appendChild(el)
      try {
        el.style.setProperty('--len', (el.getTotalLength() + 8).toFixed(2))
      } catch (error) {
        /* the CSS fallback length still hides the shape */
      }
    }
  }

  function exit() {
    if (done) return
    done = true
    stopTimers()
    if (field) field.stop()
    root.classList.add('is-exit')
    setTimeout(function () {
      if (root.parentNode) root.parentNode.removeChild(root)
    }, 900)
  }

  after(T.sign, function () {
    root.classList.add('is-sign')
  })

  after(T.split, function () {
    root.classList.add('is-split')
    if (field) {
      field.setEnergy(0.6)
      field.start()
    }
  })

  after(T.field, function () {
    root.classList.add('is-field')
    if (field) field.setEnergy(1)
  })

  after(T.slab, function () {
    root.classList.add('is-slab')
    if (field) field.stop()
    traceShell()
  })

  after(T.sketch, function () {
    root.classList.add('is-sketch')
  })

  after(T.exit, exit)

  window.addEventListener('pointerdown', exit, true)
  window.addEventListener('keydown', exit, true)
  window.addEventListener('resize', function () {
    if (root.classList.contains('is-slab')) traceShell()
  })

  function expose() {
    window.__ZCB_MOBILE__ = { exit: exit, timings: T, trace: traceShell }
  }

  expose()

  /* Static poses for design checks: ?pose=sign|hero|slab|sketch */
  var want = new URLSearchParams(location.search).get('pose')
  if (want) {
    stopTimers()
    root.classList.add('is-power', 'is-sign')
    if (want !== 'sign') {
      root.classList.add('is-split', 'is-field')
      if (field) {
        field.setEnergy(1)
        field.freeze(1100)
      }
    }
    if (want !== 'sign' && want !== 'hero') {
      root.classList.add('is-slab')
      traceShell()
      if (want === 'sketch') root.classList.add('is-sketch')
    }
  }
})()
</script>
