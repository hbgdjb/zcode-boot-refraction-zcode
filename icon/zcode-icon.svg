<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The sheet: the same -50deg axis the film uses. -->
    <linearGradient id="sheet" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse" gradientTransform="rotate(-50 512 512)">
      <stop offset="0" stop-color="#a9d8fb" />
      <stop offset="0.3" stop-color="#c8b6ff" />
      <stop offset="0.56" stop-color="#ffbfd2" />
      <stop offset="0.8" stop-color="#ffd6a8" />
      <stop offset="1" stop-color="#ffe9d2" />
    </linearGradient>

    <radialGradient id="pool" cx="0.62" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.62" />
      <stop offset="0.76" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2a1c33" flood-opacity="0.22" />
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="236" ry="236" />
    </clipPath>

    <!-- The mark, exactly as the film draws it. -->
    <path id="z-top" d="M262 288 H515 L476 352 H262 Z" />
    <path id="z-blade" d="M515 288 H765 L497 732 H245 Z" />
    <path id="z-bottom" d="M534 668 H745 V732 H497 Z" />
    <!-- Union of the three pieces: one outline, so no anti-aliased seam shows
         at icon sizes. -->
    <path id="z-mark" d="M262 288 H765 L535.6 668 H745 V732 H245 L476 352 H262 Z" />
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#sheet)" />

    <!-- The ruled field, on the same -50deg axis as the film; each hairline
         brightens with its distance from the beam. -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="butt">
      <line x1="-562.4" y1="628.7" x2="440.4" y2="-566.3" stroke-opacity="0.099" />
      <line x1="-536.3" y1="650.6" x2="466.4" y2="-544.5" stroke-opacity="0.106" />
      <line x1="-510.3" y1="672.4" x2="492.5" y2="-522.6" stroke-opacity="0.118" />
      <line x1="-484.2" y1="694.3" x2="518.5" y2="-500.8" stroke-opacity="0.136" />
      <line x1="-458.2" y1="716.1" x2="544.6" y2="-478.9" stroke-opacity="0.162" />
      <line x1="-432.1" y1="738.0" x2="570.6" y2="-457.0" stroke-opacity="0.197" />
      <line x1="-406.1" y1="759.8" x2="596.6" y2="-435.2" stroke-opacity="0.242" />
      <line x1="-380.1" y1="781.7" x2="622.7" y2="-413.3" stroke-opacity="0.294" />
      <line x1="-354.0" y1="803.5" x2="648.7" y2="-391.5" stroke-opacity="0.352" />
      <line x1="-328.0" y1="825.4" x2="674.8" y2="-369.6" stroke-opacity="0.408" />
      <line x1="-301.9" y1="847.3" x2="700.8" y2="-347.8" stroke-opacity="0.457" />
      <line x1="-275.9" y1="869.1" x2="726.9" y2="-325.9" stroke-opacity="0.492" />
      <line x1="-249.8" y1="891.0" x2="752.9" y2="-304.1" stroke-opacity="0.509" />
      <line x1="-223.8" y1="912.8" x2="779.0" y2="-282.2" stroke-opacity="0.505" />
      <line x1="-197.7" y1="934.7" x2="805.0" y2="-260.4" stroke-opacity="0.480" />
      <line x1="-171.7" y1="956.5" x2="831.1" y2="-238.5" stroke-opacity="0.438" />
      <line x1="-145.6" y1="978.4" x2="857.1" y2="-216.6" stroke-opacity="0.385" />
      <line x1="-119.6" y1="1000.2" x2="883.1" y2="-194.8" stroke-opacity="0.328" />
      <line x1="-93.6" y1="1022.1" x2="909.2" y2="-172.9" stroke-opacity="0.272" />
      <line x1="-67.5" y1="1044.0" x2="935.2" y2="-151.1" stroke-opacity="0.222" />
      <line x1="-41.5" y1="1065.8" x2="961.3" y2="-129.2" stroke-opacity="0.181" />
      <line x1="-15.4" y1="1087.7" x2="987.3" y2="-107.4" stroke-opacity="0.150" />
      <line x1="10.6" y1="1109.5" x2="1013.4" y2="-85.5" stroke-opacity="0.127" />
      <line x1="36.7" y1="1131.4" x2="1039.4" y2="-63.7" stroke-opacity="0.112" />
      <line x1="62.7" y1="1153.2" x2="1065.5" y2="-41.8" stroke-opacity="0.102" />
      <line x1="88.8" y1="1175.1" x2="1091.5" y2="-20.0" stroke-opacity="0.097" />
      <line x1="114.8" y1="1196.9" x2="1117.6" y2="1.9" stroke-opacity="0.093" />
      <line x1="140.9" y1="1218.8" x2="1143.6" y2="23.8" stroke-opacity="0.092" />
      <line x1="166.9" y1="1240.6" x2="1169.6" y2="45.6" stroke-opacity="0.091" />
      <line x1="192.9" y1="1262.5" x2="1195.7" y2="67.5" stroke-opacity="0.090" />
      <line x1="219.0" y1="1284.4" x2="1221.7" y2="89.3" stroke-opacity="0.090" />
      <line x1="245.0" y1="1306.2" x2="1247.8" y2="111.2" stroke-opacity="0.090" />
      <line x1="271.1" y1="1328.1" x2="1273.8" y2="133.0" stroke-opacity="0.090" />
      <line x1="297.1" y1="1349.9" x2="1299.9" y2="154.9" stroke-opacity="0.090" />
      <line x1="323.2" y1="1371.8" x2="1325.9" y2="176.7" stroke-opacity="0.090" />
      <line x1="349.2" y1="1393.6" x2="1352.0" y2="198.6" stroke-opacity="0.090" />
      <line x1="375.3" y1="1415.5" x2="1378.0" y2="220.5" stroke-opacity="0.090" />
      <line x1="401.3" y1="1437.3" x2="1404.1" y2="242.3" stroke-opacity="0.090" />
      <line x1="427.4" y1="1459.2" x2="1430.1" y2="264.2" stroke-opacity="0.090" />
      <line x1="453.4" y1="1481.0" x2="1456.1" y2="286.0" stroke-opacity="0.090" />
      <line x1="479.4" y1="1502.9" x2="1482.2" y2="307.9" stroke-opacity="0.090" />
      <line x1="505.5" y1="1524.8" x2="1508.2" y2="329.7" stroke-opacity="0.090" />
      <line x1="531.5" y1="1546.6" x2="1534.3" y2="351.6" stroke-opacity="0.090" />
      <line x1="557.6" y1="1568.5" x2="1560.3" y2="373.4" stroke-opacity="0.090" />
      <line x1="583.6" y1="1590.3" x2="1586.4" y2="395.3" stroke-opacity="0.090" />
    </g>

    <!-- A broad beam crossing on the same diagonal as the ruled field. -->
    <g transform="rotate(-50 512 512)">
      <rect x="-260" y="22" width="1544" height="320" fill="url(#beam)" filter="url(#soft)" />
      <rect x="-260" y="169" width="1544" height="26" fill="#ffffff" opacity="0.5" filter="url(#glow)" />
    </g>

    <rect width="1024" height="1024" fill="url(#pool)" />

    <!-- Edge light: a thin rim so the tile reads as a piece of glass. -->
    <rect x="1" y="1" width="1022" height="1022" rx="235" ry="235" fill="none" stroke="url(#rim)" stroke-width="2" />
  </g>

  <g transform="translate(-104.6 -92.7) scale(1.221)" fill="#0a0a0b" filter="url(#lift)">
    <use href="#z-mark" />
  </g>
</svg>
